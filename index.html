<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMPRESMA — Sistem Informasi Manajemen Prestasi Mahasiswa</title>

    <!-- Early Theme Initialization (Prevents White Flash) -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('simpresma_theme');
          var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Global Error Suppression for 3rd-Party Chrome Extension Scripts (Web Vitals / DevTools) -->
    <script>
      (function() {
        var origError = console.error;
        var origWarn = console.warn;

        function shouldSuppress(msg) {
          if (!msg) return false;
          var text = typeof msg === 'string'
            ? msg
            : (msg.message || msg.stack || (msg.toString ? msg.toString() : ''));
          return text.indexOf('startTime') !== -1 ||
                 text.indexOf('reportAllChanges') !== -1 ||
                 text.indexOf('chrome-extension://') !== -1 ||
                 text.indexOf('Cannot read properties of undefined (reading \'startTime\')') !== -1 ||
                 text.indexOf('Cannot read properties of undefined') !== -1;
        }

        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };

        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.message || event.error) || (event.filename && (event.filename.indexOf('VM') !== -1 || event.filename.indexOf('chrome-extension') !== -1))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (reason && shouldSuppress(reason.message || reason || reason.stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.onerror = function(msg, url) {
          if (shouldSuppress(msg) || (url && (url.indexOf('VM') !== -1 || url.indexOf('chrome-extension') !== -1))) {
            return true;
          }
        };
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
